# Docker Compose file for OpenCode runtime
# Generated by ocframework init

services:
  opencode:
    container_name: {{OCF_CONTAINER_NAME}}
    image: "${OCF_IMAGE_ID}"
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      - OPENCODE_CONFIG=${OCF_REMOTE_FRAMEWORK_CONFIG_PATH}
      - OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT=true
      - XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-/root/.config}
      - XDG_DATA_HOME=${XDG_DATA_HOME:-/root/.local/share}
      - XDG_STATE_HOME=${XDG_STATE_HOME:-/root/.local/state}
      - XDG_CACHE_HOME=${XDG_CACHE_HOME:-/root/.cache}
      - OCF_MAIN_MODEL=${OCF_MAIN_MODEL:-}
      - OCF_BUILD_MODEL=${OCF_BUILD_MODEL:-}
      - OCF_SMALL_MODEL=${OCF_SMALL_MODEL:-}
      - EDITOR=${EDITOR:-}
    volumes:
      - ${PWD}:/workspace
      - ${PWD}/.opencode/runtime_data/.cache:${XDG_CACHE_HOME:-/root/.cache}
      - ${PWD}/.opencode/runtime_data/.local/share:${XDG_DATA_HOME:-/root/.local/share}
      - ${PWD}/.opencode/runtime_data/.local/state:${XDG_STATE_HOME:-/root/.local/state}
      - ${OCF_LOCAL_GLOBAL_AUTH_PATH:-/dev/null}:${XDG_DATA_HOME:-/root/.local/share}/opencode/auth.json:ro
      - ${OCF_LOCAL_FRAMEWORK_PATH:-/dev/null}/framework-config/config.json:${OCF_REMOTE_FRAMEWORK_CONFIG_PATH:-/tmp/unused}:ro
      - ${OCF_LOCAL_GLOBAL_CONFIG_PATH:-/dev/null}:${XDG_CONFIG_HOME:-/root/.config}/opencode:ro
    entrypoint: ["/bin/bash", "-i", "-c", "exec opencode \"$@\"", "--"]
    command: [""]
