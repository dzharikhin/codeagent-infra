# Docker Compose file for the OCF agent sandbox
# Generated by ocframework init

services:
  {{SERVICE_NAME}}:
    container_name: ocf_{{OCF_REPO_ROOT_NAME}}_{{SERVICE_NAME}}
    image: "${OCF_IMAGE_ID}"
    working_dir: /{{OCF_REPO_ROOT_NAME}}
{{PORTS_SECTION}}
{{DOCKER_PRIVILEGED}}
    security_opt:
      - apparmor=unconfined
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    tty: true
    stdin_open: true
    environment:
{{AGENT_ENV}}
      - XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-/home/${REMOTE_USER}/.config}
      - XDG_DATA_HOME=${XDG_DATA_HOME:-/home/${REMOTE_USER}/.local/share}
      - XDG_STATE_HOME=${XDG_STATE_HOME:-/${REMOTE_USER}/.local/state}
      - XDG_CACHE_HOME=${XDG_CACHE_HOME:-/${REMOTE_USER}/.cache}
    volumes:
      - ${PWD}:/{{OCF_REPO_ROOT_NAME}}
      - ${PWD}/{{OCF_CONFIG_DIR}}/runtime_data:/home/${REMOTE_USER}
{{AGENT_MOUNTS}}
      - ${OCF_LOCAL_FRAMEWORK_PATH}/framework-config:${OCF_REMOTE_FRAMEWORK_CONFIG_PATH}:ro{{ADDITIONAL_VOLUME_MOUNTS}}
    entrypoint: {{ENTRYPOINT}}
    command: ""
{{TOP_LEVEL_VOLUMES_SECTION}}