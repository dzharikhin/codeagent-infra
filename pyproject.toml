[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "opencode-framework"
version = "0.1.0"
description = "Framework for attaching AI coding agents to existing projects safely"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "OpenCode Framework Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.scripts]
ocframework = "opencode_framework.cli:app"

[tool.poetry]
packages = [
    { include = "opencode_framework" }
]

include = [
    { path = "opencode_framework/templates/*", format = ["sdist", "wheel"] }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["opencode_framework"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
